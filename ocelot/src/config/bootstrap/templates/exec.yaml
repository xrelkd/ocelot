# Ocelot Bootstrap Configuration (Exec Mode)
#
# This template demonstrates the three-tier phased architecture for bootstrap.
# Exec mode executes a single program and exits (no interactive shell or supervisor).

# Console device (default: "console")
console: console

# Log level (default: "info")
logLevel: info

# Pre-switch phase
preSwitch:
  mounts: []
  environment: {}
  symlinks: []
  modules: null
  hooks: []
  sysctl: {}
  tmpfiles: null

# Switch-root phase
switchRoot:
  rootFileSystem:
    type: virtiofs
    tag: rootfs
    target: /
    overlay: false
    # Optional mount flags as boolean fields (all default to true):
    readOnly: true # MS_RDONLY
    noExec: true # MS_NOEXEC
    noSuid: true # MS_NOSUID
    noDev: true # MS_NODEV
    sync: true # MS_SYNCHRONOUS
    dirSync: true # MS_DIRSYNC
    mandatoryLocks: true # MS_MANDLOCK
    posixAcl: true # MS_POSIXACL
    atime: noAtime # AtimeMode: noAtime, relAtime, strictAtime, lazyTime

# Post-switch phase
postSwitch:
  environment: {}
  symlinks: []
  mounts: []
  hooks: []
  modules: null
  sysctl: {}
  tmpfiles: null

  # Handoff configuration
  handoff:
    mode: Exec
    program: /sbin/init
    arguments: []
