# Ocelot Bootstrap Configuration (Supervise Mode)
console: console

logLevel: info

preSwitch:
  modules:
    mode: list
    directory: /lib/modules
    names:
      - kernel/fs/9p/9p.ko.xz
      - kernel/net/9p/9pnet.ko.xz
      - kernel/net/9p/9pnet_fd.ko.xz
      - kernel/net/9p/9pnet_virtio.ko.xz
      - kernel/fs/netfs/netfs.ko.xz
      - kernel/drivers/virtio/virtio.ko.xz
      - kernel/drivers/virtio/virtio_pci.ko.xz
      - kernel/drivers/virtio/virtio_pci_legacy_dev.ko.xz
      - kernel/drivers/virtio/virtio_pci_modern_dev.ko.xz
      - kernel/drivers/virtio/virtio_ring.ko.xz
    depFilePath: modules.dep
  sysctl: {}

switchRoot:
  rootFileSystem:
    type: 9p
    tag: rootfs
    target: /
    fstype: 9p
    overlay: false

postSwitch:
  mounts:
    - type: 9p
      tag: shared
      target: /mnt/shared
      fstype: 9p
      overlay: false

  handoff:
    mode: supervise
    processes:
      timer:
        program: /bin/sh
        arguments:
          - -c
          - while true; do echo "PID $$ Now $(date)" && sleep 0.5; done
        restartPolicy:
          type: Never
      killer:
        program: /bin/sh
        arguments:
          - -c
          - echo "PID $$ Now $(date), sleep for 5s" && sleep 5 && echo "PID $$ Try to kill PID 1" && kill 1
        restartPolicy:
          type: Never
