name: Rust

on:
  push:
    branches:
      - main
      - develop
      - ci/*
      - feat/*
      - feature/*
      - fix/*
      - hotfix/*
      - release/*

  pull_request:
    paths:
      - "**/src/**"
      - ".github/**"
      - Cargo.lock
      - Cargo.toml
      - deny.toml
      - rust-toolchain.toml
      - rustfmt.toml

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: true
  RUSTC_WRAPPER: "sccache"

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    name: Check Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-gha-cache: false

      - name: Show rustfmt version
        run: |
          nix develop --command cargo fmt --version

      - name: Run cargo fmt
        run: |
          nix develop --command cargo fmt --all --verbose --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs:
      - rustfmt
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-gha-cache: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}

      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('flake.lock', '**/Cargo.lock') }}

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Show cargo clippy version
        run: |
          nix develop --command cargo clippy --version

      - name: Run cargo clippy
        run: |
          nix develop --command cargo clippy-all

  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - clippy
    env:
      NEXTEST_RETRIES: 5
    strategy:
      fail-fast: false
      matrix:
        mode:
          - release
    steps:
      - uses: actions/checkout@v7

      - name: Unblock Namespace Syscalls
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unprivileged_userns=0 || true

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-gha-cache: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}

      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ matrix.mode }}-${{ hashFiles('flake.lock', '**/Cargo.lock') }}

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Show cargo-nextest version
        run: |
          nix develop --command cargo nextest --version

      - name: Test with cargo-nextest
        run: |
          sudo env "PATH=$PATH" nix develop --command cargo nextest-all ${{ matrix.mode == 'release' && '--release' || '' }}

  doc:
    name: Doc
    runs-on: ubuntu-latest
    needs:
      - clippy

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-gha-cache: false

      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('flake.lock', '**/Cargo.lock') }}

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Run cargo doc
        run: |
          nix develop --command cargo doc-all
